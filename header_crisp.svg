<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Studio Background -->
    <linearGradient id="crisp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Razor-Sharp Platinum White Text Gradient (Vertical, NOT Horizontal) -->
    <linearGradient id="crisp-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Sleek Multi-Tone Studio Wave -->
    <linearGradient id="crisp-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2b76a" stop-opacity="0.35"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;family=JetBrains+Mono:wght@600;700;800&amp;display=swap');
      
      .name-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 62px;
        font-weight: 900;
        letter-spacing: -1.2px;
        fill: url(#crisp-white);
      }

      .sub-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #38bdf8;
      }
      
      .slash {
        fill: #64748b;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Top Solid Chassis -->
  <path d="M 0,0 L 960,0 L 960,165 C 800,200 620,155 480,175 C 340,195 160,215 0,165 Z" fill="url(#crisp-bg)"/>
  
  <!-- Subtle Wave Glow Border -->
  <path d="M 0,155 C 180,200 360,165 520,185 C 680,205 820,165 960,170 L 960,185 C 800,215 620,170 480,190 C 340,210 160,220 0,180 Z" fill="url(#crisp-wave)"/>

  <!-- Clean, Razor-Sharp Title (ZERO BLUR, PURE CRISP CONTRAST) -->
  <text class="name-text" x="480" y="94" text-anchor="middle">Raj Modi</text>

  <!-- Clean, High-Contrast Subtitle -->
  <text class="sub-text" x="480" y="136" text-anchor="middle">
    Software Development Engineer <tspan class="slash">//</tspan> Data Scientist &amp; Analyst <tspan class="slash">//</tspan> QA Tools &amp; Test Development
  </text>
</svg>