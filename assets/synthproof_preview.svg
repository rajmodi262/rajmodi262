<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="60%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="sp-cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="sp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#sp-bg)" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Title bar -->
  <rect width="600" height="38" rx="16" fill="#0b1329" fill-opacity="0.9"/>
  <circle cx="24" cy="19" r="5" fill="#ef4444"/>
  <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="19" r="5" fill="#10b981"/>
  <text class="txt-mono" font-size="11" font-weight="700" fill="#64748b" x="85" y="23">SYNTHPROOF :: AUTOMATED DATA INTEGRITY ENGINE</text>
  <text class="txt-mono" font-size="10" font-weight="800" fill="#00ff9d" x="495" y="23">[LIVE ENGINE]</text>

  <!-- Metrics Grid -->
  <g transform="translate(25, 55)">
    <!-- Metric 1 -->
    <rect width="125" height="60" rx="8" fill="#0c1830" stroke="#1e293b" stroke-width="1"/>
    <text class="txt-mono" font-size="9" fill="#64748b" x="12" y="20">SCALE</text>
    <text class="txt-mono" font-size="16" font-weight="800" fill="#00f3ff" x="12" y="44">29.4 GB</text>

    <!-- Metric 2 -->
    <rect x="140" width="125" height="60" rx="8" fill="#0c1830" stroke="#1e293b" stroke-width="1"/>
    <text class="txt-mono" font-size="9" fill="#64748b" x="152" y="20">ROWS AUDITED</text>
    <text class="txt-mono" font-size="16" font-weight="800" fill="#ffffff" x="152" y="44">80,000,000</text>

    <!-- Metric 3 -->
    <rect x="280" width="125" height="60" rx="8" fill="#0c1830" stroke="#1e293b" stroke-width="1"/>
    <text class="txt-mono" font-size="9" fill="#64748b" x="292" y="20">p95 LATENCY</text>
    <text class="txt-mono" font-size="16" font-weight="800" fill="#00ff9d" x="292" y="44">71 ms</text>

    <!-- Metric 4 -->
    <rect x="420" width="130" height="60" rx="8" fill="#022c22" stroke="#00ff9d" stroke-width="1"/>
    <text class="txt-mono" font-size="9" fill="#6ee7b7" x="432" y="20">TEST SUITES</text>
    <text class="txt-mono" font-size="16" font-weight="800" fill="#00ff9d" x="432" y="44">42/42 PASS</text>
  </g>

  <!-- Distribution Plot Box -->
  <g transform="translate(25, 130)">
    <rect width="550" height="155" rx="10" fill="#060c18" stroke="#1e293b" stroke-width="1"/>
    <text class="txt-mono" font-size="10" font-weight="700" fill="#94a3b8" x="16" y="22">MONTE CARLO CONFIDENCE INTERVALS &amp; KS-TEST DRIFT</text>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#00ff9d" x="410" y="22">p &gt; 0.998 [VALID]</text>

    <!-- Chart gridlines -->
    <line x1="20" y1="50" x2="530" y2="50" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="20" y1="85" x2="530" y2="85" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="20" y1="120" x2="530" y2="120" stroke="#1e293b" stroke-dasharray="3,3"/>

    <!-- Curves -->
    <path d="M 20,120 Q 120,118 200,80 T 320,40 T 440,75 T 530,120" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#sp-glow)"/>
    <path d="M 20,120 Q 115,115 195,82 T 315,44 T 435,78 T 530,120" fill="none" stroke="#00ff9d" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M 20,120 Q 120,118 200,80 T 320,40 T 440,75 T 530,120 L 530,140 L 20,140 Z" fill="#00f3ff" fill-opacity="0.08"/>

    <!-- Data points -->
    <circle cx="320" cy="40" r="4" fill="#00ff9d" filter="url(#sp-glow)"/>
    <circle cx="200" cy="80" r="3.5" fill="#00f3ff"/>
    <circle cx="440" cy="75" r="3.5" fill="#00f3ff"/>
  </g>

  <!-- Bottom status -->
  <g transform="translate(25, 312)" class="txt-mono" font-size="10" font-weight="700">
    <circle cx="6" cy="-3" r="3.5" fill="#00ff9d"/>
    <text fill="#00ff9d" x="16">VERIFIED DETERMINISTIC</text>
    <text fill="#64748b" x="210">SHA-256 AUDIT MERKLE PROOF</text>
    <text fill="#38bdf8" x="445">DUCKDB VECTORIZED</text>
  </g>
</svg>
