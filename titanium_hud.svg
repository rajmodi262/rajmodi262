<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <!-- Midnight Titanium Background Gradient -->
    <linearGradient id="ti-chassis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="40%" stop-color="#0f131c"/>
      <stop offset="80%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>

    <!-- Milled Titanium Bevel & Hairline Rim -->
    <linearGradient id="ti-rim-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b76a" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#475569" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2b76a" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Titanium Module Card Surface -->
    <linearGradient id="ti-card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>

    <!-- Jewel Tone Metric Gradients (Refined & Comfortable) -->
    <linearGradient id="ti-metric-tests" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="ti-metric-loc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="ti-metric-concur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="ti-metric-lat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="ti-metric-ci" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Swiss Chronometer Tourbillon Ring Gradient -->
    <linearGradient id="ti-chronometer-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="35%" stop-color="#f3d38c"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle Titanium Glow Filter -->
    <filter id="ti-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes tourbillon-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .sweep-needle {
        transform-origin: 0px 0px;
        animation: tourbillon-sweep 7s linear infinite;
      }

      @keyframes ring-draw {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 45; }
      }
      .chrono-ring {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: ring-draw 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 0.2s;
      }

      @keyframes beacon-flicker {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .beacon-dot {
        animation: beacon-flicker 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ================= 1. MASTER TITANIUM CHASSIS ================= -->
  <rect width="960" height="440" rx="16" fill="url(#ti-chassis-bg)" stroke="url(#ti-rim-stroke)" stroke-width="1.2"/>

  <!-- Subtle Precision Hairline Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="380" y1="0" x2="380" y2="440"/>
    <line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="0" y1="46" x2="960" y2="46"/>
    <line x1="0" y1="398" x2="960" y2="398"/>
  </g>

  <!-- ================= 2. TOP STATUS BAR ================= -->
  <g transform="translate(25, 28)">
    <circle class="beacon-dot" cx="0" cy="0" r="4" fill="#e2b76a"/>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#f1f5f9" x="14" y="4" letter-spacing="1.2">PRODUCTION TELEMETRY &amp; SLA VERIFICATION</text>
    <text class="txt-mono" font-size="10.5" font-weight="700" fill="#e2b76a" x="425" y="4" letter-spacing="0.8">[ LIVE STATUS: 100% DETERMINISTIC // ZERO REGRESSIONS ]</text>
    <text class="txt-mono" font-size="10" font-weight="600" fill="#64748b" x="840" y="4" letter-spacing="1">ROOT_ACCESS</text>
  </g>
  <line x1="20" y1="46" x2="940" y2="46" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= 3. COLUMN 1: VERIFIED CODEBASE & TEST METRICS ================= -->
  <g transform="translate(30, 64)">
    <text class="txt-mono" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1.2">// CORE VERIFICATION METRICS</text>

    <!-- Metric 1: Verified Tests -->
    <g transform="translate(0, 22)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">VERIFIED AUTOMATED TEST SUITE</text>
      <text class="txt-mono" font-size="22" font-weight="900" fill="#ffffff" y="26">1,164+</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#60a5fa" x="105" y="24">Across 140+ Test Suites</text>
      <rect y="34" width="315" height="3.5" rx="1.75" fill="#182130"/>
      <rect y="34" width="308" height="3.5" rx="1.75" fill="url(#ti-metric-tests)"/>
      <line x1="0" y1="46" x2="315" y2="46" stroke="#161e2b" stroke-width="1"/>
    </g>

    <!-- Metric 2: Codebase Scale -->
    <g transform="translate(0, 84)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SYSTEM CODEBASE SCALE</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#a78bfa" y="25">108,000+ LOC</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#cbd5e1" x="165" y="23">Python, C++20, Go</text>
      <rect y="33" width="315" height="3.5" rx="1.75" fill="#182130"/>
      <rect y="33" width="298" height="3.5" rx="1.75" fill="url(#ti-metric-loc)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#161e2b" stroke-width="1"/>
    </g>

    <!-- Metric 3: Concurrency Integrity -->
    <g transform="translate(0, 144)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CONCURRENCY &amp; RACE INTEGRITY</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#34d399" y="25">0 FAILS</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#cbd5e1" x="105" y="23">Atomic CAS Mutexes &amp; Queues</text>
      <rect y="33" width="315" height="3.5" rx="1.75" fill="#182130"/>
      <rect y="33" width="315" height="3.5" rx="1.75" fill="url(#ti-metric-concur)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#161e2b" stroke-width="1"/>
    </g>

    <!-- Metric 4: Latency -->
    <g transform="translate(0, 204)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">HIGH-THROUGHPUT ANALYTICS LATENCY</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#f59e0b" y="25">71ms p95</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#cbd5e1" x="120" y="23">80M Rows in DuckDB Engine</text>
      <rect y="33" width="315" height="3.5" rx="1.75" fill="#182130"/>
      <rect y="33" width="300" height="3.5" rx="1.75" fill="url(#ti-metric-lat)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#161e2b" stroke-width="1"/>
    </g>

    <!-- Metric 5: Statistical Confidence -->
    <g transform="translate(0, 264)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">STATISTICAL AUDIT CONFIDENCE</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#fb7185" y="25">99.9% CI</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#cbd5e1" x="105" y="23">Monte Carlo &amp; KS Bounds</text>
      <rect y="33" width="315" height="3.5" rx="1.75" fill="#182130"/>
      <rect y="33" width="314" height="3.5" rx="1.75" fill="url(#ti-metric-ci)"/>
    </g>
  </g>

  <!-- Divider 1 -->
  <line x1="380" y1="62" x2="380" y2="382" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= 4. COLUMN 2: KERNEL SANDBOXING & STORAGE TELEMETRY ================= -->
  <g transform="translate(410, 64)">
    <text class="txt-mono" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1.2">// KERNEL &amp; RUNTIME ISOLATION</text>

    <!-- Card 1: cgroups v2 -->
    <g transform="translate(0, 22)">
      <rect width="280" height="66" rx="8" fill="url(#ti-card-surface)" stroke="#232d3d" stroke-width="1"/>
      <line x1="0" y1="0" x2="280" y2="0" stroke="#334155" stroke-width="1" opacity="0.3"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Linux cgroups v2 Quota</text>
      <text class="txt-mono" font-size="9" fill="#94a3b8" x="14" y="38">CPU: 100% quota // Mem: 4GB ceiling</text>
      <text class="txt-mono" font-size="10" font-weight="700" fill="#60a5fa" x="14" y="54">&lt; 1ms JIT ISOLATION OVERHEAD</text>
    </g>

    <!-- Card 2: seccomp-bpf -->
    <g transform="translate(0, 98)">
      <rect width="280" height="66" rx="8" fill="url(#ti-card-surface)" stroke="#232d3d" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">seccomp-bpf Syscall Filter</text>
      <text class="txt-mono" font-size="9" fill="#94a3b8" x="14" y="38">42 Whitelisted POSIX syscalls</text>
      <text class="txt-mono" font-size="10" font-weight="700" fill="#34d399" x="14" y="54">0 TRAP VIOLATIONS // HARDENED</text>
    </g>

    <!-- Card 3: PyArrow Vectorized Zero-Copy -->
    <g transform="translate(0, 174)">
      <rect width="280" height="66" rx="8" fill="url(#ti-card-surface)" stroke="#232d3d" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Zero-Copy Memory Streaming</text>
      <text class="txt-mono" font-size="9" fill="#94a3b8" x="14" y="38">Lock-Free Ring Buffers (Go / C++)</text>
      <text class="txt-mono" font-size="10" font-weight="700" fill="#a78bfa" x="14" y="54">1.2M OPS/SEC THROUGHPUT</text>
    </g>

    <!-- Card 4: SHA-256 Merkle Ledger -->
    <g transform="translate(0, 250)">
      <rect width="280" height="66" rx="8" fill="url(#ti-card-surface)" stroke="#232d3d" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Cryptographic Audit Ledger</text>
      <text class="txt-mono" font-size="9" fill="#94a3b8" x="14" y="38">SHA-256 Merkle chain verification</text>
      <text class="txt-mono" font-size="10" font-weight="700" fill="#e2b76a" x="14" y="54">ACID IMMUTABLE // TAMPER-PROOF</text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="720" y1="62" x2="720" y2="382" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= 5. COLUMN 3: SWISS CHRONOMETER TOURBILLON ================= -->
  <g transform="translate(840, 210)">
    <!-- Titanium Concentric Gauges -->
    <circle r="72" fill="none" stroke="#252e40" stroke-width="1.5"/>
    <circle r="56" fill="none" stroke="#182233" stroke-width="1" stroke-dasharray="3,4"/>
    <circle r="40" fill="none" stroke="#1c2536" stroke-width="1"/>

    <!-- Compass Cardinal Ticks -->
    <line x1="-76" y1="0" x2="-68" y2="0" stroke="#e2b76a" stroke-width="1.5"/>
    <line x1="68" y1="0" x2="76" y2="0" stroke="#e2b76a" stroke-width="1.5"/>
    <line x1="0" y1="-76" x2="0" y2="-68" stroke="#e2b76a" stroke-width="1.5"/>
    <line x1="0" y1="68" x2="0" y2="76" stroke="#e2b76a" stroke-width="1.5"/>

    <!-- Rotating Needle Sweep Line -->
    <line class="sweep-needle" x1="0" y1="0" x2="56" y2="0" stroke="#f3d38c" stroke-width="1.5" opacity="0.75"/>

    <!-- Animated Platinum/Gold Tourbillon Progress Ring -->
    <circle class="chrono-ring" r="56" fill="none" stroke="url(#ti-chronometer-ring)" stroke-width="7" stroke-linecap="round" transform="rotate(-90)" filter="url(#ti-soft-glow)"/>

    <!-- Central S+ Grade Label -->
    <text class="txt-sans" font-size="44" font-weight="900" fill="#ffffff" x="0" y="16" text-anchor="middle" letter-spacing="0.5">S+</text>

    <!-- Overall Rank Text Identifier Underneath -->
    <text class="txt-mono" font-size="11.5" font-weight="800" fill="#e2b76a" x="0" y="96" text-anchor="middle" letter-spacing="1.5">STAFF_ARCHITECT</text>
    <text class="txt-mono" font-size="10" font-weight="600" fill="#94a3b8" x="0" y="114" text-anchor="middle" letter-spacing="1">RANK: S+ // TOP 0.1%</text>
    <text class="txt-mono" font-size="9.5" font-weight="600" fill="#cbd5e1" x="0" y="130" text-anchor="middle" letter-spacing="0.5">SLA: 100% OPERATIONAL</text>
  </g>

  <!-- ================= 6. FULL-WIDTH TELEMETRY FOOTER ================= -->
  <line x1="20" y1="398" x2="940" y2="398" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(30, 422)" class="txt-mono" font-size="10" font-weight="600">
    <text fill="#64748b">CORE: <tspan fill="#60a5fa">C++20 / PYTHON 3.12 / GO</tspan></text>
    <text x="240" fill="#64748b">DATA: <tspan fill="#a78bfa">DUCKDB (71ms p95) / REDIS</tspan></text>
    <text x="515" fill="#64748b">KERNEL: <tspan fill="#34d399">CGROUPS V2 / SECCOMP-BPF</tspan></text>
    <text x="755" fill="#64748b">PROOF: <tspan fill="#e2b76a">SHA-256 AUDIT LEDGER</tspan></text>
  </g>
</svg>