  <!-- ================= VERY BOTTOM FOOTER: CONNECT & VERIFIED PROTOCOLS ================= -->
  <g transform="translate(50, 685)">
    <!-- Connected Channels Plate -->
    <rect width="860" height="95" rx="14" fill="#060c1a" fill-opacity="0.9" stroke="url(#glass-edge)" stroke-width="1"/>
    <text class="font-mono" font-size="12" font-weight="700" fill="#00ff9d" x="25" y="30" letter-spacing="1">AUTHENTICATED COMMS CHANNELS &amp; VERIFIED SYSTEMS</text>
    
    <g transform="translate(25, 62)" class="font-mono" font-size="12.5" font-weight="700">
      <text fill="#ffffff">FLAGSHIP: <tspan fill="#00f3ff">SynthProof (29GB / 80M Rows / DuckDB Engine)</tspan></text>
      <text x="560" fill="#ffffff">GITHUB: <tspan fill="#38bdf8">github.com/rajmodi262</tspan></text>
    </g>

    <!-- Terminal Footer Block -->
