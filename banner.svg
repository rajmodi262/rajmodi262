      <circle r="95" fill="url(#avatar-aura)"/>
      <circle class="holo-radar" r="90" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="10,6,2,6" opacity="0.8"/>
      <circle r="82" fill="none" stroke="#00ff9d" stroke-width="2" filter="url(#emerald-glow)"/>
      
      <!-- Crosshairs -->
      <line x1="-105" y1="0" x2="105" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="0" y1="-105" x2="0" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Real HD Portrait Image / Core Badge -->
      <image href="https://avatars.githubusercontent.com/u/83870631?v=4" x="-75" y="-75" width="150" height="150" clip-path="url(#banner-avatar-clip)"/>
      <circle r="75" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Identification Details Under Avatar -->
    <g transform="translate(235, 305)" text-anchor="middle">
      <text class="font-sans" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">RAJ MODI</text>
      <text class="font-mono" font-size="11" font-weight="700" fill="#00f3ff" y="22" letter-spacing="2">@rajmodi262</text>
      
      <rect x="-105" y="34" width="210" height="24" rx="6" fill="#022c22" stroke="#00ff9d" stroke-width="1"/>
      <text class="font-mono" font-size="9.5" font-weight="800" fill="#00ff9d" y="50" letter-spacing="1.5">VERIFIED SYSTEMS ARCHITECT</text>
      
      <!-- Telemetry Subtext -->
      <text class="font-mono" font-size="9.5" font-weight="600" fill="#64748b" y="84" letter-spacing="1">108K+ LOC AUDITED // 1,164+ TESTS PASS</text>
      <text class="font-mono" font-size="9.5" font-weight="600" fill="#38bdf8" y="100" letter-spacing="1">RANK: S+ // TOP 0.1%</text>
    </g>
  </g>

  <!-- ================= MIDDLE ROW: TECH ARSENAL MATRIX PILLS ================= -->
