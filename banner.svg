    <!-- Row 1: Core Technologies -->
    <g transform="translate(0, 15)">
      <rect width="110" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00f3ff" x="55" y="20" text-anchor="middle">C++20 / STL</text>

      <rect x="120" width="125" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="182.5" y="20" text-anchor="middle">Python 3.12</text>

      <rect x="255" width="105" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" x="307.5" y="20" text-anchor="middle">Go / Concurrency</text>

      <rect x="370" width="135" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="437.5" y="20" text-anchor="middle">DuckDB Engine</text>

      <rect x="515" width="130" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" x="580" y="20" text-anchor="middle">Linux Systems</text>

      <rect x="655" width="140" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00f3ff" x="725" y="20" text-anchor="middle">Docker / cgroups</text>

      <rect x="805" width="130" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="870" y="20" text-anchor="middle">PostgreSQL / ACID</text>

      <rect x="945" width="125" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" x="1007.5" y="20" text-anchor="middle">Redis In-Memory</text>

      <rect x="1080" width="125" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="1142.5" y="20" text-anchor="middle">PyArrow / Parquet</text>

      <rect x="1215" width="125" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#ef4444" x="1277.5" y="20" text-anchor="middle">SHA-256 Merkle</text>
    </g>

    <!-- Row 2: Verification, OS & Infrastructure Tools -->
    <g transform="translate(0, 60)">
      <rect width="135" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" x="67.5" y="20" text-anchor="middle">NumPy / SciPy</text>

      <rect x="145" width="145" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="217.5" y="20" text-anchor="middle">seccomp-bpf Filters</text>

      <rect x="300" width="130" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#ffffff" x="365" y="20" text-anchor="middle">Git / GitHub Actions</text>

      <rect x="440" width="145" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" x="512.5" y="20" text-anchor="middle">Monte Carlo Tests</text>

      <rect x="595" width="125" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#f59e0b" x="657.5" y="20" text-anchor="middle">WebSockets / gRPC</text>

      <rect x="730" width="130" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="795" y="20" text-anchor="middle">Streamlit / Web</text>

      <rect x="870" width="135" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#f59e0b" x="937.5" y="20" text-anchor="middle">OpenCV / Vision</text>

      <rect x="1015" width="155" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#ffffff" x="1092.5" y="20" text-anchor="middle">Prometheus Telemetry</text>

      <rect x="1180" width="160" height="32" rx="8" fill="#0a1224" stroke="url(#glass-edge)" stroke-width="1"/>
      <text class="font-mono" font-size="11.5" font-weight="700" fill="#00ff9d" x="1260" y="20" text-anchor="middle">1,164+ Test Suites</text>
    </g>
