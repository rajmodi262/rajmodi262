        <text y="24" fill="#94a3b8">MOTTO: <tspan fill="#ffffff">"Deterministic code. Rigorous automated verification."</tspan></text>
        <text y="46" fill="#38bdf8">ENCRYPT: <tspan fill="#64748b">SHA-256 // VERIFIED ARCHITECT</tspan></text>
      </g>
    </g>
  </g>

  <!-- Outer Neon Synth Frame Borders Wrapper -->
  <rect x="20" y="20" width="1400" height="800" rx="20" fill="none" stroke="url(#neon-cyan-green)" stroke-width="1.5" opacity="0.4"/>
</svg>
