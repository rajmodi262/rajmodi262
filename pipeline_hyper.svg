<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Master Titanium Slate Chassis -->
    <linearGradient id="chassis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="40%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>

    <linearGradient id="chassis-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b76a" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e2b76a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glowing Laser Bus -->
    <linearGradient id="laser-bus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Stage 1 Theme: Hyper Cyan -->
    <linearGradient id="c1-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#08101d"/>
    </linearGradient>

    <!-- Stage 2 Theme: Royal Violet -->
    <linearGradient id="c2-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151530"/>
      <stop offset="100%" stop-color="#0d0d1f"/>
    </linearGradient>

    <!-- Stage 3 Theme: Plasma Magenta -->
    <linearGradient id="c3-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241020"/>
      <stop offset="100%" stop-color="#140912"/>
    </linearGradient>

    <!-- Stage 4 Theme: Hyper Emerald -->
    <linearGradient id="c4-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d241d"/>
      <stop offset="100%" stop-color="#071410"/>
    </linearGradient>

    <!-- Stage 5 Theme: Solar Amber Gold -->
    <linearGradient id="c5-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="c5-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261c0e"/>
      <stop offset="100%" stop-color="#171008"/>
    </linearGradient>

    <!-- Active Laser Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&amp;family=Inter:wght@600;700;800;900&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes laser-pulse {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .laser-wire {
        stroke-dasharray: 8, 8;
        animation: laser-pulse 3s linear infinite;
      }

      @keyframes photon-speed {
        0% { transform: translateX(0px); opacity: 0.1; }
        30% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translateX(760px); opacity: 0.1; }
      }
      .photon-orb {
        animation: photon-speed 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes scan-line {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateX(960px); opacity: 0; }
      }
      .scanner {
        animation: scan-line 5s linear infinite;
      }

      @keyframes badge-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .pulse-dot {
        animation: badge-pulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ================= 1. MASTER CHASSIS ================= -->
  <rect width="960" height="380" rx="18" fill="url(#chassis-bg)" stroke="url(#chassis-rim)" stroke-width="1.4"/>

  <!-- Scanning Laser Line across Top -->
  <line class="scanner" x1="0" y1="46" x2="160" y2="46" stroke="url(#laser-bus)" stroke-width="2" filter="url(#neon-glow)"/>

  <!-- ================= 2. TOP STATUS BAR ================= -->
  <g transform="translate(24, 28)">
    <circle class="pulse-dot" cx="0" cy="0" r="4.5" fill="#34d399"/>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#f8fafc" x="14" y="4" letter-spacing="1.2">FULL-STACK &amp; SYSTEMS VERIFICATION PIPELINE</text>
    <text class="txt-mono" font-size="10.5" font-weight="700" fill="#e2b76a" x="520" y="4" letter-spacing="0.8">[ STREAM: 1.2M OPS/SEC // LATENCY &lt; 20ms ]</text>
    <text class="txt-mono" font-size="10" font-weight="700" fill="#38bdf8" x="840" y="4" letter-spacing="1">LIVE_PIPELINE</text>
  </g>
  <line x1="20" y1="46" x2="940" y2="46" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= 3. ACTIVE FIBER LASER CONDUIT ================= -->
  <g transform="translate(100, 200)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="3"/>
    <line class="laser-wire" x1="0" y1="0" x2="760" y2="0" stroke="url(#laser-bus)" stroke-width="3" filter="url(#neon-glow)"/>
    <!-- Photon Bullet -->
    <circle class="photon-orb" cx="0" cy="0" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #00f0ff)"/>
  </g>

  <!-- ================= 4. THE 5 VIBRANT STAGE CARTRIDGES ================= -->

  <!-- STAGE 1: DATA INGESTION -->
  <g transform="translate(20, 68)">
    <rect width="174" height="248" rx="12" fill="url(#c1-bg)" stroke="#1e3a5f" stroke-width="1.2"/>
    <path d="M 0,12 C 0,5 5,0 12,0 L 162,0 C 169,0 174,5 174,12 L 174,28 L 0,28 Z" fill="url(#c1-rim)"/>
    <g transform="translate(10, 20)">
      <text class="txt-mono" font-size="10" font-weight="900" fill="#ffffff">01 // INGESTION</text>
      <text class="txt-sans" font-size="13" font-weight="900" fill="#f8fafc" y="22">Data Ingestion</text>
    </g>
    <!-- 3 High-Visibility Data Chips -->
    <g transform="translate(10, 72)">
      <rect width="154" height="32" rx="6" fill="#102038" stroke="#1e3a5f" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#00f0ff"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="20">29GB / 80M Rows</text>

      <rect y="40" width="154" height="32" rx="6" fill="#102038" stroke="#1e3a5f" stroke-width="1"/>
      <rect y="40" width="3.5" height="32" rx="1.5" fill="#00f0ff"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="60">DuckDB Columnar</text>

      <rect y="80" width="154" height="32" rx="6" fill="#102038" stroke="#1e3a5f" stroke-width="1"/>
      <rect y="80" width="3.5" height="32" rx="1.5" fill="#00f0ff"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="100">PyArrow Streaming</text>

      <!-- Active Status Badge -->
      <rect y="124" width="154" height="32" rx="6" fill="#072033" stroke="#00f0ff" stroke-width="1.2"/>
      <circle cx="14" cy="140" r="3.5" fill="#00f0ff"/>
      <text class="txt-mono" font-size="10.5" font-weight="800" fill="#38bdf8" x="24" y="144">ZERO LOSS PASS</text>
    </g>
  </g>

  <!-- STAGE 2: KERNEL SANDBOX -->
  <g transform="translate(206, 68)">
    <rect width="174" height="248" rx="12" fill="url(#c2-bg)" stroke="#2b2d56" stroke-width="1.2"/>
    <path d="M 0,12 C 0,5 5,0 12,0 L 162,0 C 169,0 174,5 174,12 L 174,28 L 0,28 Z" fill="url(#c2-rim)"/>
    <g transform="translate(10, 20)">
      <text class="txt-mono" font-size="10" font-weight="900" fill="#ffffff">02 // ISOLATION</text>
      <text class="txt-sans" font-size="13" font-weight="900" fill="#f8fafc" y="22">Kernel Sandbox</text>
    </g>
    <!-- 3 High-Visibility Data Chips -->
    <g transform="translate(10, 72)">
      <rect width="154" height="32" rx="6" fill="#1a1c3b" stroke="#312e81" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#818cf8"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="20">Linux cgroups v2</text>

      <rect y="40" width="154" height="32" rx="6" fill="#1a1c3b" stroke="#312e81" stroke-width="1"/>
      <rect y="40" width="3.5" height="32" rx="1.5" fill="#818cf8"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="60">seccomp-bpf Rules</text>

      <rect y="80" width="154" height="32" rx="6" fill="#1a1c3b" stroke="#312e81" stroke-width="1"/>
      <rect y="80" width="3.5" height="32" rx="1.5" fill="#818cf8"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="100">C++20 Namespaces</text>

      <!-- Active Status Badge -->
      <rect y="124" width="154" height="32" rx="6" fill="#161738" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="14" cy="140" r="3.5" fill="#818cf8"/>
      <text class="txt-mono" font-size="10.5" font-weight="800" fill="#a5b4fc" x="24" y="144">&lt; 1ms OVERHEAD</text>
    </g>
  </g>

  <!-- STAGE 3: CONCURRENCY -->
  <g transform="translate(392, 68)">
    <rect width="174" height="248" rx="12" fill="url(#c3-bg)" stroke="#4c1d38" stroke-width="1.2"/>
    <path d="M 0,12 C 0,5 5,0 12,0 L 162,0 C 169,0 174,5 174,12 L 174,28 L 0,28 Z" fill="url(#c3-rim)"/>
    <g transform="translate(10, 20)">
      <text class="txt-mono" font-size="10" font-weight="900" fill="#ffffff">03 // CONCURRENCY</text>
      <text class="txt-sans" font-size="13" font-weight="900" fill="#f8fafc" y="22">Atomic Engine</text>
    </g>
    <!-- 3 High-Visibility Data Chips -->
    <g transform="translate(10, 72)">
      <rect width="154" height="32" rx="6" fill="#2b1424" stroke="#831843" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#f43f5e"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="20">Atomic CAS Locks</text>

      <rect y="40" width="154" height="32" rx="6" fill="#2b1424" stroke="#831843" stroke-width="1"/>
      <rect y="40" width="3.5" height="32" rx="1.5" fill="#f43f5e"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="60">Lock-Free Buffers</text>

      <rect y="80" width="154" height="32" rx="6" fill="#2b1424" stroke="#831843" stroke-width="1"/>
      <rect y="80" width="3.5" height="32" rx="1.5" fill="#f43f5e"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="100">Go Async Runtimes</text>

      <!-- Active Status Badge -->
      <rect y="124" width="154" height="32" rx="6" fill="#300d20" stroke="#f43f5e" stroke-width="1.2"/>
      <circle cx="14" cy="140" r="3.5" fill="#f43f5e"/>
      <text class="txt-mono" font-size="10.5" font-weight="800" fill="#fda4af" x="24" y="144">ZERO-RACE 10K RPS</text>
    </g>
  </g>

  <!-- STAGE 4: VERIFICATION -->
  <g transform="translate(578, 68)">
    <rect width="174" height="248" rx="12" fill="url(#c4-bg)" stroke="#164e3b" stroke-width="1.2"/>
    <path d="M 0,12 C 0,5 5,0 12,0 L 162,0 C 169,0 174,5 174,12 L 174,28 L 0,28 Z" fill="url(#c4-rim)"/>
    <g transform="translate(10, 20)">
      <text class="txt-mono" font-size="10" font-weight="900" fill="#ffffff">04 // VERIFY</text>
      <text class="txt-sans" font-size="13" font-weight="900" fill="#f8fafc" y="22">Automated Audit</text>
    </g>
    <!-- 3 High-Visibility Data Chips -->
    <g transform="translate(10, 72)">
      <rect width="154" height="32" rx="6" fill="#122a22" stroke="#065f46" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#34d399"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="20">Monte Carlo Bounds</text>

      <rect y="40" width="154" height="32" rx="6" fill="#122a22" stroke="#065f46" stroke-width="1"/>
      <rect y="40" width="3.5" height="32" rx="1.5" fill="#34d399"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="60">KS &amp; Epps-Singleton</text>

      <rect y="80" width="154" height="32" rx="6" fill="#122a22" stroke="#065f46" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#34d399"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="100">140+ Test Suites</text>

      <!-- Active Status Badge -->
      <rect y="124" width="154" height="32" rx="6" fill="#082b1d" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="14" cy="140" r="3.5" fill="#34d399"/>
      <text class="txt-mono" font-size="10.5" font-weight="800" fill="#6ee7b7" x="24" y="144">100% SUITE PASS</text>
    </g>
  </g>

  <!-- STAGE 5: AUDIT & PROOF -->
  <g transform="translate(764, 68)">
    <rect width="174" height="248" rx="12" fill="url(#c5-bg)" stroke="#523916" stroke-width="1.2"/>
    <path d="M 0,12 C 0,5 5,0 12,0 L 162,0 C 169,0 174,5 174,12 L 174,28 L 0,28 Z" fill="url(#c5-rim)"/>
    <g transform="translate(10, 20)">
      <text class="txt-mono" font-size="10" font-weight="900" fill="#ffffff">05 // PROOF</text>
      <text class="txt-sans" font-size="13" font-weight="900" fill="#f8fafc" y="22">Cryptographic Proof</text>
    </g>
    <!-- 3 High-Visibility Data Chips -->
    <g transform="translate(10, 72)">
      <rect width="154" height="32" rx="6" fill="#302312" stroke="#78350f" stroke-width="1"/>
      <rect width="3.5" height="32" rx="1.5" fill="#fbbf24"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="20">SHA-256 Ledger</text>

      <rect y="40" width="154" height="32" rx="6" fill="#302312" stroke="#78350f" stroke-width="1"/>
      <rect y="40" width="3.5" height="32" rx="1.5" fill="#fbbf24"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="60">Postgres &amp; Redis</text>

      <rect y="80" width="154" height="32" rx="6" fill="#302312" stroke="#78350f" stroke-width="1"/>
      <rect y="80" width="3.5" height="32" rx="1.5" fill="#fbbf24"/>
      <text class="txt-sans" font-size="11.5" font-weight="700" fill="#ffffff" x="12" y="100">Prometheus Telemetry</text>

      <!-- Active Status Badge -->
      <rect y="124" width="154" height="32" rx="6" fill="#33200a" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="14" cy="140" r="3.5" fill="#fbbf24"/>
      <text class="txt-mono" font-size="10.5" font-weight="800" fill="#fde68a" x="24" y="144">ACID IMMUTABLE</text>
    </g>
  </g>

  <!-- ================= 5. FOOTER STATS RIBBON ================= -->
  <line x1="20" y1="335" x2="940" y2="335" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(26, 358)" class="txt-mono" font-size="10" font-weight="600">
    <text fill="#64748b">ARCHITECTURE: <tspan fill="#f8fafc" font-weight="700">DISTRIBUTED SYSTEMS &amp; AI VERIFICATION</tspan></text>
    <text x="375" fill="#64748b">THROUGHPUT: <tspan fill="#34d399" font-weight="700">1.2M OPS/SEC</tspan></text>
    <text x="615" fill="#64748b">DEPLOYMENT: <tspan fill="#818cf8" font-weight="700">DOCKER &amp; LINUX KERNEL</tspan></text>
    <text x="840" fill="#64748b">UPTIME: <tspan fill="#fbbf24" font-weight="700">99.99%</tspan></text>
  </g>
</svg>