<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="main-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#040711" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#00ff9d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="neon-cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strong-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typography & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-line {
        transform-origin: 0px 0px;
        animation: radar-sweep 6s linear infinite;
      }

      @keyframes fill-ring {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 50; }
      }
      .rank-ring {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: fill-ring 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 0.3s;
      }

      @keyframes pulse-beacon {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .pulse-dot {
        animation: pulse-beacon 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ================= 1. MASTER CHASSIS FRAME ================= -->
  <rect width="960" height="440" rx="20" fill="url(#main-card-bg)" stroke="url(#glass-edge)" stroke-width="2" filter="url(#subtle-glow)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.035" stroke="#00f3ff" stroke-width="1">
    <line x1="380" y1="0" x2="380" y2="440"/>
    <line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="0" y1="46" x2="960" y2="46"/>
    <line x1="0" y1="398" x2="960" y2="398"/>
    <circle cx="380" cy="46" r="3" fill="#00f3ff"/>
    <circle cx="720" cy="46" r="3" fill="#00ff9d"/>
    <circle cx="380" cy="398" r="3" fill="#00ff9d"/>
    <circle cx="720" cy="398" r="3" fill="#00f3ff"/>
  </g>

  <!-- ================= 2. TOP STATUS BAR ================= -->
  <g transform="translate(25, 28)">
    <circle class="pulse-dot" cx="0" cy="0" r="5" fill="#00ff9d" filter="url(#subtle-glow)"/>
    <text class="txt-sans" font-size="12.5" font-weight="800" fill="#94a3b8" x="16" y="4" letter-spacing="1.5">PRODUCTION TELEMETRY &amp; SLA VERIFICATION</text>
    <text class="txt-mono" font-size="11" font-weight="700" fill="#00ff9d" x="420" y="4" letter-spacing="1">[ LIVE STATUS: 100% OPERATIONAL // ZERO REGRESSIONS ]</text>
    <text class="txt-mono" font-size="10" font-weight="700" fill="#00f3ff" x="840" y="4" letter-spacing="1">ROOT_ACCESS</text>
  </g>
  <line x1="20" y1="46" x2="940" y2="46" stroke="url(#glass-edge)" stroke-width="1" opacity="0.5"/>

  <!-- ================= 3. COLUMN 1: VERIFIED CODEBASE & TEST METRICS ================= -->
  <g transform="translate(30, 64)">
    <text class="txt-mono" font-size="11" font-weight="800" fill="#00f3ff" letter-spacing="1.2">// CORE VERIFICATION METRICS</text>

    <!-- Metric 1: Verified Tests -->
    <g transform="translate(0, 22)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">VERIFIED AUTOMATED TEST SUITE</text>
      <text class="txt-mono" font-size="22" font-weight="900" fill="#ffffff" y="26">1,164+</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#00f3ff" x="105" y="24">Across 140+ Test Suites</text>
      <rect y="34" width="315" height="4" rx="2" fill="#0f172a"/>
      <rect y="34" width="308" height="4" rx="2" fill="url(#progress-bar-grad)"/>
      <line x1="0" y1="46" x2="315" y2="46" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Metric 2: Codebase Scale -->
    <g transform="translate(0, 84)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">SYSTEM CODEBASE SCALE</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#00f3ff" y="25" filter="url(#subtle-glow)">108,000+ LOC</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#94a3b8" x="165" y="23">Python, C++20, Go</text>
      <rect y="33" width="315" height="4" rx="2" fill="#0f172a"/>
      <rect y="33" width="298" height="4" rx="2" fill="url(#progress-bar-grad)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Metric 3: Concurrency Integrity -->
    <g transform="translate(0, 144)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">CONCURRENCY &amp; RACE INTEGRITY</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#00ff9d" y="25" filter="url(#subtle-glow)">0 FAILS</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#94a3b8" x="105" y="23">Atomic CAS Mutexes &amp; Queues</text>
      <rect y="33" width="315" height="4" rx="2" fill="#0f172a"/>
      <rect y="33" width="315" height="4" rx="2" fill="url(#neon-cyan-green)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Metric 4: Latency -->
    <g transform="translate(0, 204)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">HIGH-THROUGHPUT ANALYTICS LATENCY</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#00f3ff" y="25" filter="url(#subtle-glow)">71ms p95</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#94a3b8" x="120" y="23">80M Rows in DuckDB Engine</text>
      <rect y="33" width="315" height="4" rx="2" fill="#0f172a"/>
      <rect y="33" width="300" height="4" rx="2" fill="url(#progress-bar-grad)"/>
      <line x1="0" y1="45" x2="315" y2="45" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Metric 5: Statistical Confidence -->
    <g transform="translate(0, 264)">
      <text class="txt-sans" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">STATISTICAL AUDIT CONFIDENCE</text>
      <text class="txt-mono" font-size="20" font-weight="800" fill="#38bdf8" y="25">99.9% CI</text>
      <text class="txt-sans" font-size="10.5" font-weight="600" fill="#94a3b8" x="105" y="23">Monte Carlo &amp; KS Bounds</text>
      <rect y="33" width="315" height="4" rx="2" fill="#0f172a"/>
      <rect y="33" width="314" height="4" rx="2" fill="url(#progress-bar-grad)"/>
    </g>
  </g>

  <!-- Divider 1 -->
  <line x1="380" y1="62" x2="380" y2="382" stroke="url(#glass-edge)" stroke-width="1.5" opacity="0.4"/>

  <!-- ================= 4. COLUMN 2: KERNEL SANDBOXING & STORAGE TELEMETRY ================= -->
  <g transform="translate(410, 64)">
    <text class="txt-mono" font-size="11" font-weight="800" fill="#00ff9d" letter-spacing="1.2">// KERNEL &amp; RUNTIME ISOLATION</text>

    <!-- Card 1: cgroups v2 -->
    <g transform="translate(0, 22)">
      <rect width="280" height="66" rx="8" fill="#040916" stroke="#1e293b" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Linux cgroups v2 Quota</text>
      <text class="txt-mono" font-size="9" fill="#64748b" x="14" y="38">CPU: 100% quota // Mem: 4GB ceiling</text>
      <text class="txt-mono" font-size="10" font-weight="800" fill="#00ff9d" x="14" y="54">&lt; 1ms JIT ISOLATION OVERHEAD</text>
    </g>

    <!-- Card 2: seccomp-bpf -->
    <g transform="translate(0, 98)">
      <rect width="280" height="66" rx="8" fill="#040916" stroke="#1e293b" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">seccomp-bpf Syscall Filter</text>
      <text class="txt-mono" font-size="9" fill="#64748b" x="14" y="38">42 Whitelisted POSIX syscalls</text>
      <text class="txt-mono" font-size="10" font-weight="800" fill="#00f3ff" x="14" y="54">0 TRAP VIOLATIONS // HARDENED</text>
    </g>

    <!-- Card 3: PyArrow Vectorized Zero-Copy -->
    <g transform="translate(0, 174)">
      <rect width="280" height="66" rx="8" fill="#040916" stroke="#1e293b" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Zero-Copy Memory Streaming</text>
      <text class="txt-mono" font-size="9" fill="#64748b" x="14" y="38">Lock-Free Ring Buffers (Go / C++)</text>
      <text class="txt-mono" font-size="10" font-weight="800" fill="#38bdf8" x="14" y="54">1.2M OPS/SEC THROUGHPUT</text>
    </g>

    <!-- Card 4: SHA-256 Merkle Ledger -->
    <g transform="translate(0, 250)">
      <rect width="280" height="66" rx="8" fill="#040916" stroke="#1e293b" stroke-width="1"/>
      <text class="txt-sans" font-size="11" font-weight="700" fill="#f8fafc" x="14" y="20">Cryptographic Audit Ledger</text>
      <text class="txt-mono" font-size="9" fill="#64748b" x="14" y="38">SHA-256 Merkle chain verification</text>
      <text class="txt-mono" font-size="10" font-weight="800" fill="#00ff9d" x="14" y="54">ACID IMMUTABLE // TAMPER-PROOF</text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="720" y1="62" x2="720" y2="382" stroke="url(#glass-edge)" stroke-width="1.5" opacity="0.4"/>

  <!-- ================= 5. COLUMN 3: RADAR HUD & ARCHITECT RANK ================= -->
  <g transform="translate(840, 210)">
    <!-- Radar Background Concentric Rings -->
    <circle r="72" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle r="56" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="38" fill="none" stroke="#0f172a" stroke-width="1"/>

    <!-- Crosshairs -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Rotating Radar Sweep Line -->
    <line class="radar-line" x1="0" y1="0" x2="58" y2="0" stroke="#00f3ff" stroke-width="2" opacity="0.75"/>

    <!-- Animated Foreground Ring Progress Tracker -->
    <circle class="rank-ring" r="58" fill="none" stroke="url(#neon-cyan-green)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)" filter="url(#subtle-glow)"/>

    <!-- Central S+ Grade Label -->
    <text class="txt-sans" font-size="44" font-weight="900" fill="#ffffff" x="0" y="16" text-anchor="middle" letter-spacing="0.5">S+</text>

    <!-- Overall Rank Text Identifier Underneath -->
    <text class="txt-mono" font-size="12" font-weight="900" fill="#00ff9d" x="0" y="96" text-anchor="middle" letter-spacing="2">STAFF_ARCHITECT</text>
    <text class="txt-mono" font-size="10" font-weight="700" fill="#64748b" x="0" y="114" text-anchor="middle" letter-spacing="1">RANK: S+ // TOP 0.1%</text>
    <text class="txt-mono" font-size="9" font-weight="600" fill="#00f3ff" x="0" y="130" text-anchor="middle" letter-spacing="0.5">SLA: 100% OPERATIONAL</text>
  </g>

  <!-- ================= 6. FULL-WIDTH TELEMETRY FOOTER ================= -->
  <line x1="20" y1="398" x2="940" y2="398" stroke="url(#glass-edge)" stroke-width="1" opacity="0.5"/>
  <g transform="translate(30, 422)" class="txt-mono" font-size="10" font-weight="700">
    <text fill="#64748b">CORE: <tspan fill="#00f3ff">C++20 / PYTHON 3.12 / GO</tspan></text>
    <text x="240" fill="#64748b">DATA: <tspan fill="#00ff9d">DUCKDB (71ms p95) / REDIS</tspan></text>
    <text x="515" fill="#64748b">KERNEL: <tspan fill="#f8fafc">CGROUPS V2 / SECCOMP-BPF</tspan></text>
    <text x="755" fill="#64748b">PROOF: <tspan fill="#00ff9d">SHA-256 AUDIT LEDGER</tspan></text>
  </g>
</svg>