<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="25%" stop-color="#050f24"/>
      <stop offset="55%" stop-color="#081e3a"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020409" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="text-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="name-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');
      .header-name {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .header-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <path d="M 0,0 L 960,0 L 960,175 C 800,210 620,165 480,185 C 340,205 160,225 0,175 Z" fill="url(#header-bg)"/>
  <path d="M 0,165 C 180,210 360,175 520,195 C 680,215 820,175 960,180 L 960,195 C 800,225 620,180 480,200 C 340,220 160,230 0,190 Z" fill="url(#wave-grad)" opacity="0.6"/>

  <text class="header-name" x="480" y="96" fill="url(#text-glow-grad)" text-anchor="middle" filter="url(#name-glow)">Raj Modi</text>
  <text class="header-sub" x="480" y="140" fill="#00f3ff" text-anchor="middle">
    Software Development Engineer  //  Data Scientist &amp; Analyst  //  QA Tools &amp; Test Development
  </text>
</svg>